<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio | Viktoria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="logo" href="index.html">Viktoria</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Open menu">
          <span></span>
        </button>
        <nav class="site-nav" aria-label="Primary">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="services.html">Services</a>
          <a href="portfolio.html" aria-current="page">Portfolio</a>
          <a href="inquire.html">Inquire</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page-hero wrap">
        <p class="kicker">Selected work</p>
        <h1>Portfolio</h1>
        <p>A glimpse of the worlds we build for ambitious founders.</p>
      </section>

      <section class="wrap portfolio-grid">
        <figure>
          <img src="images/holding-laptop.jpg" alt="Viktoria standing with a laptop" />
          <figcaption>Studio portrait</figcaption>
        </figure>
        <figure>
          <img class="obj-notes" src="images/desk-notes.jpg" alt="Viktoria writing at her desk" />
          <figcaption>At the desk</figcaption>
        </figure>
        <figure>
          <img class="obj-call" src="images/on-a-call.jpg" alt="Viktoria on a phone call" />
          <figcaption>On a call</figcaption>
        </figure>
        <figure>
          <img class="obj-words" src="images/be-creative.jpg" alt="Hand writing the words Be creative" />
          <figcaption>Be creative</figcaption>
        </figure>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>&copy; <span data-year></span> Viktoria</p>
        <p>Luxury social for female-led businesses</p>
      </div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
